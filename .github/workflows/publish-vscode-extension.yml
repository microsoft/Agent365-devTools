name: Publish VS Code Extension

on:
  push:
    tags:
      - 'vscode-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .vscode-extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Sync skills from .claude/skills/
        run: npm run sync-skills

      - name: Type check
        run: npx tsc --noEmit

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx vsce package

      - name: Publish to VS Marketplace
        run: npx vsce publish --pat ${{ secrets.MARKETPLACE_PAT }}
