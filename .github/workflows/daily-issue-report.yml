name: Daily Issue Report

on:
  schedule:
    # Run daily at 9 AM UTC (adjust as needed)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      send_teams:
        description: 'Send to MS Teams (requires TEAMS_WEBHOOK_URL secret)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  issues: read
  contents: read

jobs:
  daily-report:
    runs-on: ubuntu-latest
    name: Generate Daily Issue Report

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd autoTriage
          pip install -r requirements.txt

      - name: Generate Daily Report
        id: report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          cd autoTriage
          python -c "
import json
from services.daily_report_service import DailyReportService

service = DailyReportService()
report = service.generate_report('${{ github.repository_owner }}', '${{ github.event.repository.name }}')

# Save report data
report_data = {
    'total_open': report.total_open,
    'sla_compliance_pct': report.sla_compliance_pct,
    'breached_count': report.breached_count,
    'warning_count': report.warning_count,
    'by_priority': report.by_priority,
    'issues': [
        {
            'number': i.number,
            'title': i.title,
            'priority': i.priority,
            'assignee': i.assignee,
            'hours_open': i.hours_open,
            'sla_hours': i.sla_hours,
            'sla_status': i.sla_status,
            'url': i.url
        }
        for i in report.issues
    ]
}

with open('report.json', 'w') as f:
    json.dump(report_data, f)

print(f'total_open={report.total_open}')
print(f'sla_compliance={report.sla_compliance_pct}')
print(f'breached={report.breached_count}')
"

      - name: Generate Summary
        run: |
          cd autoTriage
          python -c "
import json
from datetime import datetime

with open('report.json') as f:
    report = json.load(f)

# Determine status emoji
if report['sla_compliance_pct'] >= 90:
    status = '✅'
    status_text = 'Healthy'
elif report['sla_compliance_pct'] >= 70:
    status = '⚠️'
    status_text = 'Warning'
else:
    status = '🔴'
    status_text = 'Critical'

# Build markdown summary
md = []
md.append('# 📊 Daily Issue Report')
md.append('')
md.append(f'**Repository:** \`${{ github.repository }}\`')
md.append(f'**Generated:** {datetime.utcnow().strftime(\"%Y-%m-%d %H:%M UTC\")}')
md.append('')
md.append('## Summary')
md.append('')
md.append(f'| Metric | Value |')
md.append(f'|--------|-------|')
md.append(f'| Total Open Issues | **{report[\"total_open\"]}** |')
md.append(f'| SLA Compliance | {status} **{report[\"sla_compliance_pct\"]}%** ({status_text}) |')
md.append(f'| Breached (Over SLA) | 🔴 **{report[\"breached_count\"]}** |')
md.append(f'| Warning (>80% SLA) | ⚠️ **{report[\"warning_count\"]}** |')
md.append('')
md.append('## By Priority')
md.append('')
md.append('| Priority | Count |')
md.append('|----------|-------|')
for p in ['P0', 'P1', 'P2', 'P3', 'P4', 'None']:
    count = report['by_priority'].get(p, 0)
    if count > 0:
        md.append(f'| {p} | {count} |')
md.append('')
md.append('## Issues (sorted by SLA urgency)')
md.append('')
md.append('| Issue | Priority | Assignee | Hours Open | SLA | Status |')
md.append('|-------|----------|----------|------------|-----|--------|')

for issue in report['issues'][:20]:  # Top 20
    status_icon = '🔴' if issue['sla_status'] == 'breached' else ('⚠️' if issue['sla_status'] == 'warning' else '✅')
    md.append(f'| [#{issue[\"number\"]}]({issue[\"url\"]}) | {issue[\"priority\"]} | @{issue[\"assignee\"]} | {issue[\"hours_open\"]}h | {issue[\"sla_hours\"]}h | {status_icon} |')

if len(report['issues']) > 20:
    md.append(f'| ... | *{len(report[\"issues\"]) - 20} more issues* | | | | |')

md.append('')
md.append('---')
md.append('*Generated by AutoTriage Daily Report*')

# Write to GitHub Summary
summary = '\\n'.join(md)
with open('${{ github.step_summary }}', 'a') as f:
    f.write(summary.replace('\\\\n', '\\n'))

print('Summary generated!')
" 2>&1 || echo "Summary generation completed"

      - name: Send to Teams (optional)
        if: inputs.send_teams == 'true' && env.TEAMS_WEBHOOK_URL != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          cd autoTriage
          python -c "
from services.daily_report_service import DailyReportService

service = DailyReportService()
report = service.run('${{ github.repository_owner }}', '${{ github.event.repository.name }}', send_teams=True)
print(f'Sent to Teams: {report.total_open} issues')
"
