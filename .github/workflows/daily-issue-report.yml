name: Daily Issue Report

on:
  schedule:
    # Run daily at 9 AM UTC (adjust as needed)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      send_teams:
        description: 'Send to MS Teams (requires TEAMS_WEBHOOK_URL secret)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  issues: read
  contents: read

jobs:
  daily-report:
    runs-on: ubuntu-latest
    name: Generate Daily Issue Report

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd autoTriage
          pip install -r requirements.txt

      - name: Generate Daily Report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          cd autoTriage
          
          # Build command
          CMD="python daily_report.py --owner ${{ github.repository_owner }} --repo ${{ github.event.repository.name }} --output report.json --summary $GITHUB_STEP_SUMMARY"
          
          # Add Teams flag if requested
          if [ "${{ inputs.send_teams }}" == "true" ]; then
            CMD="$CMD --send-teams"
          fi
          
          eval $CMD

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: autoTriage/report.json
          retention-days: 30
